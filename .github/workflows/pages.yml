# Publishes the generated project page (site/) to GitHub Pages. The main page and Speedlab companion are built locally by tools/make_site.py and tools/make_speed_site.py
# from result files and committed, so this workflow only uploads it.
name: pages
# Runs by hand until the owner turns Pages on; after that set the repository variable PAGES_AUTO=true to deploy on every push.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.PAGES_AUTO == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: rm -f site/page.html site/chart_options.html site/og_card.html   # preview wrapper, an internal options page, the source of og.png: not part of the public site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
