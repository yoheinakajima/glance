# CPU-only test suite: no model weights are downloaded (tests that need a model are skipped).
name: tests
# Manual for now (the dependency install is heavy); add push / pull_request triggers once it has run green once.
on:
  workflow_dispatch:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - run: uv sync
      - run: uv run pytest -q
