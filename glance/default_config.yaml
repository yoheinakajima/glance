# glance v0 default configuration. Every model is pinned by revision SHA (HANDOFF section 3).
# Licenses and check dates are recorded in MODELS.md.

paths:
  hf_home: .cache/hf            # HF_HOME; gitignored, 30 GB disk budget
  eval_images: .cache/eval_images
  logs: logs
  runs: runs
  calibration: calibration
  human_gold: gold/human_gold.jsonl

models:
  siglip:
    id: google/siglip2-base-patch16-256
    revision: 3f9f96cb90da5dbc758b01813f2f6f1aee24c1ab
    photo_prefix: false          # "a photo of {text}" prefix, off by default
  vlm_tiers:
    cuda_24gb:
      id: Qwen/Qwen3-VL-8B-Instruct
      revision: 0c351dd01ed87e9c1b53cbc748cba10e6187ff3b
      dtype: bfloat16
      image_token_budget: 768
    cuda_12gb:
      id: Qwen/Qwen3-VL-4B-Instruct
      revision: ebb281ec70b05090aa6165b016eac8ec08e71b17
      dtype: bfloat16
      image_token_budget: 768
    apple_32gb:
      id: Qwen/Qwen3-VL-4B-Instruct
      revision: ebb281ec70b05090aa6165b016eac8ec08e71b17
      dtype: float16
      image_token_budget: 768
    apple_8gb:
      id: Qwen/Qwen3-VL-2B-Instruct
      revision: 89644892e4d85e24eaac8bacfd4f463576704203
      dtype: float16
      image_token_budget: 384
  # Optional overrides. Leave null to use what `glance doctor` selects.
  tier_override: null
  # Any Hugging Face image-text-to-text model with a chat template instead of the tiers above (same as --model-id).
  # Only Qwen3-VL and SmolVLM2 are measured in this repository. Example:
  #   generic: {id: HuggingFaceTB/SmolVLM2-2.2B-Instruct, revision: 482adb537c021c86670beed01cd58990d01e72e4, image_longest_edge: 768}
  generic: null
  image_token_budget_override: null

vlm:
  batch_size: 8                  # reference path: full prompts per forward batch
  suffix_batch_size: 16          # cached path: statement suffixes per forward batch
  prefix_cache: false            # false = reference path (same as --no-prefix-cache); flipped on in M4
  letter_rotations: 4            # "up to 4 cyclic rotations" for the letter method
  off_mass_warn: 0.1

limits:                          # image limits; request-shape limits are constants in glance/schema.py
  max_image_mb: 20
  formats: [JPEG, PNG, WEBP]
  max_side: 2048                 # resize policy: downscale so the longest side fits

eval:
  seed: 7
  n_cuda: 1000
  n_apple: 500
  manifest_n: 1000               # manifests cover the largest default n
  max_hours: 4
  warmup_items: 10
  baseline_n: 300
  ece_bins: 15
  permutation_items: 100
  permutation_orders: 3
  letter_max_options: 26
  latency_repeats: 20
  max_failure_rate: 0.02
  top_errors: 20

calibration:
  isotonic_min_n: 1000

server:
  host: 127.0.0.1
  port: 8077
